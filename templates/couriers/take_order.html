{% extends "base.html" %}
{% block content %}
<div style="max-width: 450px; margin: 40px auto; padding: 25px; background: #fff; border-radius: 12px; box-shadow: 0 4px 14px rgba(0,0,0,0.1); text-align: center;">
    <h2 style="margin-bottom: 15px;">📥 Взятие заказа</h2>
    <p style="font-size: 16px; color: #444;">Вы уверены, что хотите взять этот заказ?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" style="
            margin-top: 20px;
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 22px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: .2s;">
            ✅ Подтвердить
        </button>
    </form>
</div>
{% endblock %}
