{% extends "base.html" %}{% load i18n %}{% block title %}Мой профиль — Тёпло{% endblock %}{% block content %}
<section class="container section narrow page-top">
  <span class="eyebrow">Всегда под рукой</span>
  <h1 class="page-title">
    Мой <em>профиль</em>
  </h1>
  <p><a class="text-link" href="{% url 'saved_addresses' %}">{% translate "Сохранённые адреса" %}</a>
    · <a class="text-link" href="{% url 'favorites' %}">{% translate "Избранное" %}</a></p>
  <form method="post" class="panel form-panel">
    {% csrf_token %}
    {% include "includes/form.html" %}
    <button class="button">Сохранить изменения</button>
  </form><form action="{% url 'logout' %}" method="post" class="spaced">{% csrf_token %}<button class="button secondary">{% translate "Выйти" %}</button></form>
</section>
{% endblock %}
