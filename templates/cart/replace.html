{% extends "base.html" %}
{% load i18n %}
{% block content %}
  <section class="container section narrow">
    <div class="panel">
      <h1 class="page-title">{% translate "Сменить ресторан?" %}</h1>
      <p>{% translate "В корзине блюда другого ресторана. Для нового заказа нужно очистить корзину." %}</p>
      <form action="{% url 'add_to_cart' item.pk %}" method="post">
        {% csrf_token %}
        <input type="hidden"
               name="replace"
               value="yes"><button class="button">{% translate "Очистить и добавить" %} {% translate item.name %}</button>
      </form>
      <a class="text-link" href="{% url 'cart_detail' %}">{% translate "Оставить корзину" %}</a>
    </div>
  </section>
{% endblock %}
