{% extends "base.html" %}
{% load i18n %}
{% block content %}
  <section class="container section narrow">
    <div class="panel">
      <h1 class="page-title">{% translate "Сменить ресторан?" %}</h1>
      <p>{{ confirm_message }}</p>
      <form action="{% if lunch_token %}{% url 'add_lunch' %}{% else %}{% url 'add_to_cart' item.pk %}{% endif %}" method="post">
        {% csrf_token %}
        {% if lunch_token %}<input type="hidden" name="lunch" value="{{ lunch_token }}">{% endif %}
        <input type="hidden"
               name="replace"
               value="yes"><button class="button">{% translate "Очистить и добавить" %}</button>
      </form>
      <a class="text-link" href="{% url 'cart_detail' %}">{% translate "Оставить корзину" %}</a>
    </div>
  </section>
{% endblock %}
